<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matter.js + jQuery 로또볼</title>
    <style>
      @font-face {
        font-family: "Ria";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/RiaSans-ExtraBold.woff2") format("woff2");
        font-weight: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "KerisKedyuche";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_R.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "KerisKedyuche";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_B.woff2") format("woff2");
        font-weight: 700;
        font-display: swap;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f4f4f4;
        font-family: "Ria", sans-serif;
      }

      .stage_wrap {
        position: relative;
        width: 704px;
        height: 704px;
        box-sizing: border-box;
        border-radius: 50%;
        overflow: hidden;
        background: url("./images/event/20261127/lotto_bg.png") no-repeat 0 / cover;
      }

      #stage {
        width: 100%;
        height: 585px;
      }

      /* ===== 구슬 공통 ===== */
      .ball {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
        border-radius: 50%;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
        user-select: none;
        will-change: transform;
      }

      .text_wrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        font-family: "KerisKedyuche", sans-serif;
      }
      .ball_tit,
      .ball_text {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
      }
      .ball_tit {
        font-weight: 400;
        color: #fff;
      }

      /* ===== large ===== */
      .ball.large {
        width: 200px;
        height: 200px;
        color: #954a4e;
        background: url("./images/event/20261127/lotto_ball01.png") no-repeat 0 / cover;
      }
      .ball.large .ball_tit {
        top: 146px;
        font-size: 20px;
      }
      .ball.large .ball_text {
        top: 52px;
      }
      .ball.large .ball_text span:first-child {
        font-size: 46px;
      }
      .ball.large .ball_text span:last-child {
        font-size: 43px;
      }

      /* ===== medium ===== */
      .ball.medium {
        width: 150px;
        height: 150px;
        color: #98501c;
        background: url("./images/event/20261127/lotto_ball02.png") no-repeat 0 / cover;
      }
      .ball.medium .ball_tit {
        top: 110px;
        font-size: 16px;
      }
      .ball.medium .ball_text {
        top: 38px;
      }
      .ball.medium .ball_text span:first-child {
        font-size: 37px;
      }
      .ball.medium .ball_text span:last-child {
        font-size: 35px;
      }

      /* ===== regular ===== */
      .ball.regular {
        width: 120px;
        height: 120px;
        color: #007343;
        background: url("./images/event/20261127/lotto_ball03.png") no-repeat 0 / cover;
      }
      .ball.regular .ball_tit {
        top: 88px;
        font-size: 13px;
      }
      .ball.regular .ball_text {
        top: 30px;
      }
      .ball.regular .ball_text span:first-child {
        font-size: 30px;
      }
      .ball.regular .ball_text span:last-child {
        font-size: 28px;
      }

      /* ===== empty ===== */
      .ball.empty {
        width: 120px;
        height: 120px;
        color: #007343;
        background: url("./images/event/20261127/lotto_ball_empty.png") no-repeat 0 / cover;
      }

      .ball.empty .ball_tit {
        top: 88px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="stage_wrap">
      <div id="stage">
        <!--
            [개발 참고]
            - 구슬 9개가 마크업에 고정되어 있습니다. 개수/종류는 이 HTML에서 관리합니다.
            - 종류는 클래스로 구분: .large / .medium / .regular
            - 값 주입 자리 (.text()로 넣을 것, .html() 사용 금지):
                .ball_text 첫 번째 span = 값 (예: 2100)
                .ball_text 두 번째 span = 단위 (예: 개)
                .ball_tit 안의 span     = 제목 (예: 모은 초코칩)
            - 아래 텍스트는 퍼블 확인용 샘플입니다.
          -->

        <!-- large x3 -->
        <div class="ball large">
          <div class="text_wrap">
            <p class="ball_text"><span>2100</span><span>개</span></p>
            <p class="ball_tit"><span>모은 초코칩</span></p>
          </div>
        </div>
        <div class="ball large">
          <div class="text_wrap">
            <p class="ball_text"><span>8</span><span>월</span></p>
            <p class="ball_tit"><span>열공한 달</span></p>
          </div>
        </div>
        <div class="ball large">
          <div class="text_wrap">
            <p class="ball_text"><span>3</span><span>위</span></p>
            <p class="ball_tit"><span>열공 순위</span></p>
          </div>
        </div>

        <!-- medium x3 -->
        <div class="ball medium">
          <div class="text_wrap">
            <p class="ball_text"><span>12</span><span>위</span></p>
            <p class="ball_tit"><span>명예의 랭킹</span></p>
          </div>
        </div>
        <div class="ball medium">
          <div class="text_wrap">
            <p class="ball_text"><span>화</span><span>요일</span></p>
            <p class="ball_tit"><span>열공한 요일</span></p>
          </div>
        </div>
        <div class="ball medium">
          <div class="text_wrap">
            <p class="ball_text"><span>980</span><span>개</span></p>
            <p class="ball_tit"><span>모은 초코칩</span></p>
          </div>
        </div>

        <!-- regular x2 -->
        <div class="ball regular">
          <div class="text_wrap">
            <p class="ball_text"><span>7</span><span>위</span></p>
            <p class="ball_tit"><span>열공 순위</span></p>
          </div>
        </div>
        <div class="ball regular">
          <div class="text_wrap">
            <p class="ball_text"><span>금</span><span>요일</span></p>
            <p class="ball_tit"><span>열공한 요일</span></p>
          </div>
        </div>

        <div class="ball empty">
          <div class="text_wrap">
            <p class="ball_tit"><span>열공 출석부</span></p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
      $(function () {
        const { Engine, Runner, Bodies, Body, Composite, Events, Mouse, MouseConstraint } = Matter;

        const $stage = $("#stage");
        const stageEl = $stage[0];

        const engine = Engine.create({});
        engine.gravity.y = 0.3;
        const world = engine.world;
        const balls = [];
        let W = stageEl.clientWidth;
        let H = stageEl.clientHeight;
        let walls = [];

        // ===== 원형 벽 =====
        function buildWalls() {
          if (walls.length) Composite.remove(world, walls);

          const R = W / 2;
          const CX = W / 2;
          const CY = R;
          const SEGMENTS = 64;
          const WALL_T = 100;
          const segLen = (2 * Math.PI * (R + WALL_T / 2)) / SEGMENTS + 2;
          walls = [];

          for (let i = 0; i < SEGMENTS; i++) {
            const a = (i / SEGMENTS) * Math.PI * 2;

            // 바닥(H)보다 아래에 있는 곡선 조각은 제외
            if (CY + Math.sin(a) * R > H) continue;

            const dist = R + WALL_T / 2;
            walls.push(
              Bodies.rectangle(CX + Math.cos(a) * dist, CY + Math.sin(a) * dist, WALL_T, segLen, {
                isStatic: true,
                angle: a,
              }),
            );
          }

          // 평평한 바닥: 윗면이 정확히 y = H
          walls.push(Bodies.rectangle(W / 2, H + WALL_T / 2, W + WALL_T * 2, WALL_T, { isStatic: true }));

          Composite.add(world, walls);
        }
        buildWalls();

        // ===== 마크업에 있는 .ball마다 물리 바디 생성 (크기는 CSS에서 읽음) =====
        // ===== 구슬 투입 타이밍 =====

        // ===== 마크업의 .ball마다 물리 바디 생성 (크기는 CSS에서 읽음) =====
        $stage.find(".ball").each(function () {
          const $el = $(this);
          const r = $el.outerWidth() / 2;

          // 위쪽에서 시작, 좌우만 랜덤
          const x = W / 2 + (Math.random() - 0.5) * (W - r * 2 - 200);
          const y = r + 10;

          const body = Bodies.circle(x, y, r, {
            restitution: 0.6,
            friction: 0.05,
          });
          body.$el = $el;
          body.inWorld = false;
          balls.push(body);

          // 투입 전에는 숨김
          $el.css("visibility", "hidden");
        });

        // 1초 뒤 전체 구슬을 동시에 표시 + 투입
        setTimeout(function () {
          $.each(balls, function (i, b) {
            b.inWorld = true;
            b.$el.css("visibility", "visible");
          });
          Composite.add(world, balls);
        }, 0);

        // ===== 리사이즈: CSS가 바꾼 컨테이너/구슬 크기를 물리 세계에 반영 =====
        function syncSize() {
          const newW = stageEl.clientWidth;
          const ratio = newW / W;

          if (newW !== W) {
            W = newW;
            buildWalls();
          }

          $.each(balls, function (i, b) {
            if (ratio !== 1) {
              Body.setPosition(b, { x: b.position.x * ratio, y: b.position.y * ratio });
              Body.setVelocity(b, { x: 0, y: 0 });
            }
            const newR = b.$el.outerWidth() / 2;
            const s = newR / b.circleRadius;
            if (Math.abs(s - 1) > 0.001) Body.scale(b, s, s);
          });
        }

        let timer;
        $(window).on("resize", function () {
          clearTimeout(timer);
          timer = setTimeout(syncSize, 80);
        });

        // ===== 물리 -> DOM =====
        const MAX_DEG = 30; // ball 최대 기울기 (±)
        const MAX_RAD = (MAX_DEG * Math.PI) / 180;

        Events.on(engine, "afterUpdate", function () {
          $.each(balls, function (i, b) {
            const r = b.circleRadius;

            // 각도를 -180°~180°로 정규화 후 ±30°로 제한
            const a = Math.atan2(Math.sin(b.angle), Math.cos(b.angle));
            const tilt = Math.max(-MAX_RAD, Math.min(MAX_RAD, a));

            b.$el.css("transform", "translate(" + (b.position.x - r) + "px," + (b.position.y - r) + "px) rotate(" + tilt + "rad)");
          });
        });

        Runner.run(Runner.create(), engine);
      });
    </script>
  </body>
</html>
